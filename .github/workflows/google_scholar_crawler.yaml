name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - google_scholar_crawler/**
      - .github/workflows/google_scholar_crawler.yaml
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Collect Google Scholar citations
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'K09z_dEAAAAJ' }}
        run: python main.py
      - name: Publish citation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stats_dir="$RUNNER_TEMP/google-scholar-stats"
          git init -b google-scholar-stats "$stats_dir"
          cd "$stats_dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch --depth=1 origin google-scholar-stats
            git checkout -B google-scholar-stats FETCH_HEAD
          fi
          cp "$GITHUB_WORKSPACE/google_scholar_crawler/results/"*.json .
          git add '*.json'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update Google Scholar citation data'
          git push origin HEAD:google-scholar-stats
